# Fly.io config for the crypto-ai autotrade worker.
#
# Region fra (Frankfurt, EU) — Bybit is reachable from here. The free
# allowance covers a single shared-cpu-1x machine with 256 MB RAM and a
# 3 GB volume; we use only ~120 MB resident.

app             = "crypto-ai-worker"
primary_region  = "fra"
kill_signal     = "SIGTERM"
kill_timeout    = "30s"

[build]
  dockerfile = "../worker/Dockerfile"

[env]
  AT_SCAN_INTERVAL_SEC = "300"
  AT_MIN_CONFIDENCE = "60"
  AT_MIN_RR = "1.3"
  AT_MAX_CONCURRENT = "1"
  AT_LEVERAGE = "3"
  AT_POSITION_PCT = "2.0"
  AT_DAILY_LOSS_PCT = "5.0"
  AT_WEEKLY_LOSS_PCT = "12.0"
  AT_BREAKEVEN_AT_R = "0.7"
  AT_TIMEFRAMES = "1h,4h"
  AT_COINS = "BTC,ETH,BNB,SOL,XRP,ADA,DOGE,AVAX,TON,DOT"

[mounts]
  source      = "autotrade_data"
  destination = "/data"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes           = ["app"]

  [http_service.concurrency]
    type        = "connections"
    hard_limit  = 25
    soft_limit  = 20

  [[http_service.checks]]
    interval     = "30s"
    grace_period = "20s"
    method       = "GET"
    path         = "/healthz"
    protocol     = "http"
    timeout      = "5s"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 512
